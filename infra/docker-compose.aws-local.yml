# Local smoke-test compose for the AWS production images.
#
# Starts the ECR-destined containers plus a local PostgreSQL instance
# so you can verify the images before pushing to AWS.
#
# Usage:
#   1. Copy .env.aws-local.example to .env.aws-local and fill in secrets.
#   2. Build all images first (from repo root):
#        API_URL=http://localhost:8000 \
#          docker compose -f infra/docker-compose.aws-local.yml build
#      or use the pre-built test images.
#   3. Start:
#        docker compose -f infra/docker-compose.aws-local.yml --env-file infra/.env.aws-local up -d
#   4. Open http://localhost:3000  (web dashboard)
#      Open http://localhost:8000/docs  (API)
#      Open http://localhost:3001/docs  (Docs)
#      Open http://localhost:3002/network-editor
#      Open http://localhost:3003/psv   (PSV)
#      Open http://localhost:3004/design-agents/
#      Open http://localhost:3005/venting-calculation
#      Open http://localhost:3006/vessels-calculation
#      Open http://localhost:3007/pump-calculation
#      Open http://localhost:3008/heat-transfer-calculation
#      Open http://localhost:3009/control-valve-calculation

services:
  # ── PostgreSQL (local stand-in for RDS) ──────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: engsuite
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aws_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI backend ───────────────────────────────────────────────────────
  api:
    image: pes-api:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/engsuite
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost:3008,http://localhost:3009}
      DEPLOYMENT_ENV: aws
      LOG_LEVEL: INFO
      SEED_FROM_MOCK: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "cd /app/services/api && alembic upgrade head && python scripts/seed_from_mock.py && exec uvicorn services.api.main:app --host 0.0.0.0 --port 8000"

  # ── Web dashboard (root app, no basePath) ────────────────────────────────
  web:
    image: pes-web:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: web
        BASE_PATH: ""
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
        DOCS_URL: ${DOCS_URL:-http://localhost:3001}
        NETWORK_EDITOR_URL: ${NETWORK_EDITOR_URL:-http://localhost:3002}
        PSV_URL: ${PSV_URL:-http://localhost:3003}
        DESIGN_AGENTS_URL: ${DESIGN_AGENTS_URL:-http://localhost:3004}
        VENTING_URL: ${VENTING_URL:-http://localhost:3005}
        VESSELS_CALCULATION_URL: ${VESSELS_CALCULATION_URL:-http://localhost:3006}
        PUMP_URL: ${PUMP_URL:-http://localhost:3007}
        HEAT_TRANSFER_URL: ${HEAT_TRANSFER_URL:-http://localhost:3008}
        CONTROL_VALVE_URL: ${CONTROL_VALVE_URL:-http://localhost:3009}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ── Docs ─────────────────────────────────────────────────────────────────
  docs:
    image: pes-docs:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: docs
        BASE_PATH: /docs
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "3001:3000"

  # ── PSV sizing ───────────────────────────────────────────────────────────
  psv:
    image: pes-psv:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: psv
        BASE_PATH: /psv
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "3003:3000"

  # ── Network editor ───────────────────────────────────────────────────────
  network-editor:
    image: pes-network-editor:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: network-editor
        BASE_PATH: /network-editor
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "3002:3000"

  # ── Design agents (Vite/Nginx) ───────────────────────────────────────────
  design-agents:
    image: pes-design-agents:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.vite
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3004:80"

  # ── Tank venting calculation ─────────────────────────────────────────────
  venting-calculation:
    image: pes-venting-calculation:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: venting-calculation
        BASE_PATH: /venting-calculation
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "3005:3000"

  # ── Vessel calculation ───────────────────────────────────────────────────
  vessels-calculation:
    image: pes-vessels-calculation:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: vessels-calculation
        BASE_PATH: /vessels-calculation
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "3006:3000"

  # ── Pump calculation ─────────────────────────────────────────────────────
  pump-calculation:
    image: pes-pump-calculation:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: pump-calculation
        BASE_PATH: /pump-calculation
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "3007:3000"

  # ── Heat transfer calculation ────────────────────────────────────────────
  heat-transfer-calculation:
    image: pes-heat-transfer-calculation:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: heat-transfer-calculation
        BASE_PATH: /heat-transfer-calculation
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "3008:3000"

  # ── Control valve calculation ────────────────────────────────────────────
  control-valve-calculation:
    image: pes-control-valve-calculation:test
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        APP_NAME: control-valve-calculation
        BASE_PATH: /control-valve-calculation
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "3009:3000"

volumes:
  aws_local_pgdata:
