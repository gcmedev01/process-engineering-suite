services:
  # All Web Apps (Ports 3000-3009)
  apps:
    image: oven/bun:alpine
    working_dir: /app
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/web/.next
      - /app/apps/docs/.next
      - /app/apps/network-editor/.next
      - /app/apps/psv/.next
      - /app/apps/design-agents/dist
      - /app/apps/venting-calculation/.next
      - /app/apps/vessels-calculation/.next
      - /app/apps/pump-calculation/.next
      - /app/apps/heat-transfer-calculation/.next
      - /app/apps/control-valve-calculation/.next
    # Install dependencies if missing, then run all apps with turbo
    command: sh -c "bun install && bun run dev"
    ports:
      - "3000:3000" # Dashboard (web)
      - "3001:3001" # Docs
      - "3002:3002" # Network Editor
      - "3003:3003" # PSV
      - "3004:3004" # Design Agents
      - "3005:3005" # Venting Calculation
      - "3006:3006" # Vessels Calculation
      - "3007:3007" # Pump Calculation
      - "3008:3008" # Heat Transfer Calculation
      - "3009:3009" # Control Valve Calculation
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_AUTH_API_URL=http://localhost:8000
      - API_PROXY_TARGET=http://api:8000
      - VITE_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

  # Python API (Port 8000)
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    working_dir: /app/services/api
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/app/services/api
      - ../packages:/app/packages
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/engsuite
      - SEED_FROM_MOCK=true
    depends_on:
      postgres:
        condition: service_healthy

    # Run migrations then start API (dev reload)
    command: sh -c "until pg_isready -h postgres -p 5432 -U postgres; do sleep 1; done && alembic -c /app/services/api/alembic.ini upgrade heads && python /app/services/api/scripts/seed_from_mock.py && uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    image: postgres:17-alpine # Latest stable version as of 2025-12-12
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=engsuite
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
